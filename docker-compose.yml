# Yerel PostgreSQL: parolayı ortam değişkeniyle verin (dosyada parola yok).
#   $env:POSTGRES_PASSWORD = "..."; docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ag_simulasyon
      POSTGRES_USER: ag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD ortam değişkenini tanımlayın}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
